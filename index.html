<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title> ShipAssist AI | Logistics Support</title>
    <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css" rel="stylesheet">
    <style>
        :root {
            --bg-main: #0b141a;
            --bg-chat: #0b141a;
            --panel-header: #202c33;
            --text-primary: #e9edef;
            --text-secondary: #8696a0;
            --accent: #00a884;
            --bubble-out: #005c4b;
            --bubble-in: #202c33;
            --agent-bubble: #374151;
            --system-msg: rgba(255, 255, 255, 0.05);
            --danger: #f15c5c;
        }

        /* RESET & BASE */
        * { margin: 0; padding: 0; box-sizing: border-box; font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif; }

        html, body {
            height: 100%;
            overflow: hidden;
            background-color: var(--bg-main);
            color: var(--text-primary);
        }

        /* MAIN APP LAYOUT (NO SIDEBARS/ANALYTICS) */
        .app-container {
            display: flex;
            flex-direction: column;
            width: 100%;
            height: 100vh;
            max-width: 1000px;
            margin: 0 auto;
            position: relative;
        }

        .main-chat {
            flex: 1;
            display: flex;
            flex-direction: column;
            height: 100%;
            overflow: hidden;
            background-image: url('https://user-images.githubusercontent.com/15075759/28719144-86dc0f70-73b1-11e7-911d-60d70fcded21.png');
            background-blend-mode: overlay;
            background-color: var(--bg-chat);
        }

        /* CHAT HEADER */
        .chat-header {
            height: 60px;
            background: var(--panel-header);
            padding: 10px 16px;
            display: flex;
            align-items: center;
            gap: 15px;
            flex-shrink: 0;
            z-index: 10;
        }

        .profile-pic { width: 40px; height: 40px; border-radius: 50%; background: #00a884; display: flex; align-items: center; justify-content: center; }

        /* MESSAGES AREA */
        .messages-container {
            flex: 1;
            overflow-y: auto;
            padding: 20px 5%;
            display: flex;
            flex-direction: column;
            gap: 4px;
            scroll-behavior: smooth;
        }

        /* MESSAGE STYLES */
        .msg {
            max-width: 75%;
            padding: 10px 14px;
            border-radius: 8px;
            font-size: 14.5px;
            position: relative;
            margin-bottom: 2px;
            box-shadow: 0 1px 0.5px rgba(0,0,0,0.13);
            animation: fadeIn 0.3s ease;
            line-height: 1.5;
            word-wrap: break-word;
        }

        @keyframes fadeIn { from { opacity: 0; transform: translateY(5px); } to { opacity: 1; transform: translateY(0); } }

        .msg.sent { align-self: flex-end; background: var(--bubble-out); border-top-right-radius: 0; }
        .msg.received { align-self: flex-start; background: var(--bubble-in); border-top-left-radius: 0; }
        .msg.agent { background: var(--agent-bubble) !important; border-left: 4px solid #eab308 !important; color: #ffffff; }

        .msg.system {
            align-self: center;
            background: var(--system-msg);
            color: var(--text-secondary);
            font-size: 12px;
            text-transform: uppercase;
            letter-spacing: 1px;
            padding: 5px 15px;
            border-radius: 4px;
            margin: 15px 0;
            text-align: center;
        }

        .msg-time { font-size: 10px; color: rgba(255,255,255,0.4); float: right; margin-top: 5px; margin-left: 10px; }
        .ticks { color: #53bdeb; margin-left: 4px; }

        /* QUICK ACTIONS & INPUT */
        .quick-actions { display: flex; gap: 8px; flex-wrap: wrap; padding: 10px 5%; }
        .action-chip {
            background: var(--panel-header);
            border: 1px solid var(--accent);
            color: var(--accent);
            padding: 6px 14px;
            border-radius: 18px;
            font-size: 13px;
            cursor: pointer;
            transition: 0.2s;
        }
        .action-chip:hover { background: var(--accent); color: white; }

        .input-area {
            background: var(--panel-header);
            padding: 10px 16px;
            display: flex;
            align-items: center;
            gap: 15px;
            padding-bottom: calc(10px + env(safe-area-inset-bottom));
        }

        .input-wrapper { flex: 1; background: #2a3942; border-radius: 8px; padding: 9px 12px; }
        .input-wrapper input { width: 100%; background: transparent; border: none; color: white; outline: none; font-size: 15px; }

        .action-btn { color: var(--text-secondary); font-size: 22px; cursor: pointer; }
        .typing-indicator { font-size: 13px; color: var(--accent); font-style: italic; height: 20px; margin: 0 5% 5px 5%; }

        /* SCROLL BUTTON */
        #scrollBtn {
            position: absolute;
            bottom: 85px;
            right: 20px;
            background: var(--panel-header);
            color: var(--accent);
            width: 40px;
            height: 40px;
            border-radius: 50%;
            display: none;
            align-items: center;
            justify-content: center;
            cursor: pointer;
            z-index: 100;
        }

        .mode-badge { font-size: 10px; padding: 2px 6px; border-radius: 4px; font-weight: bold; margin-left: 8px; }
        .mode-ai { background: var(--accent); color: white; }
        .mode-human { background: #eab308; color: #000; }
        .hidden { display: none !important; }

        /* SCROLLBAR */
        .messages-container::-webkit-scrollbar { width: 6px; }
        .messages-container::-webkit-scrollbar-thumb { background: #374045; border-radius: 10px; }

        @media (max-width: 768px) {
            .app-container { max-width: 100%; }
            .msg { max-width: 90%; }
        }
    </style>
</head>
<body>

<div class="app-container">
    <div class="main-chat">
        <div class="chat-header">
            <div class="profile-pic"><i class="fas fa-robot"></i></div>
            <div style="flex:1">
                <div style="display: flex; align-items: center;">
                    <span style="font-weight: 500;">ShipAssist AI Support</span>
                    <span id="modeBadge" class="mode-badge mode-ai">AI ACTIVE</span>
                </div>
                <div id="connectionStatus" style="font-size: 12px; color: var(--text-secondary);">online</div>
            </div>
            <div style="display: flex; gap: 15px;">
                <i class="fas fa-phone action-btn" style="font-size: 18px;"></i>
                <i class="fas fa-ellipsis-v action-btn" style="font-size: 18px;"></i>
            </div>
        </div>

        <div class="messages-container" id="chatContainer">
            <div class="msg system">Encryption enabled. Your conversation is secure.</div>
            <div class="msg received">
                👋 Welcome to ShipAssist AI Support.<br><br>
                I can help you track your package, resolve delivery issues, or connect you to an agent. How can I assist you today?
                <div class="msg-time">09:00</div>
            </div>
        </div>

        <div id="bottomStickyWrapper">
            <div class="quick-actions" id="quickActions">
                <div class="action-chip" onclick="handleQuickAction('Track Package')">📦 Track Package</div>
                <div class="action-chip" onclick="handleQuickAction('Delivery Issue')">⚠️ Delivery Issue</div>
                <div class="action-chip" onclick="handleQuickAction('Talk to Agent')">📞 Talk to Agent</div>
            </div>

            <div id="typingArea" class="typing-indicator"></div>

            <div class="input-area">
                <i class="far fa-smile action-btn"></i>
                <div class="input-wrapper">
                    <input type="text" id="userInput" placeholder="Type a message..." autocomplete="off">
                </div>
                <i class="fas fa-paper-plane action-btn" id="sendBtn" style="color: var(--accent);"></i>
            </div>
        </div>
        
        <div id="scrollBtn" onclick="scrollToBottom()"><i class="fas fa-chevron-down"></i></div>
    </div>
</div>

<script>
    const chatContainer = document.getElementById('chatContainer');
    const userInput = document.getElementById('userInput');
    const sendBtn = document.getElementById('sendBtn');
    const typingArea = document.getElementById('typingArea');
    const modeBadge = document.getElementById('modeBadge');
    const connectionStatus = document.getElementById('connectionStatus');
    const scrollBtn = document.getElementById('scrollBtn');
    const quickActions = document.getElementById('quickActions');

    // DATA & RECOVERED HUMAN BEHAVIOR LOGIC
    const agentName = "Sarah";
    const db = {
        "SPX123456": { status: "Arrived at Station", loc: "Madina Branch, Ghana", note: "Please come with your ID." },
        "SPD987654": { status: "In Transit", loc: "Enroute to Kumasi Hub", note: "Vehicle departed Accra." },
        "SPXWH233": { status: "At Warehouse", loc: "ACCRA DC", note: "Processing for departure." }
    };

    let state = { isHumanMode: false, agentIntroduced: false };

    const INTENTS = {
        TRACKING: /(track|where|status|check|order)/i,
        CONTACT: /(agent|human|talk|speak|person)/i,
        THANKS: /(thank|thx|grateful)/i
    };

    // INPUT HANDLING
    userInput.focus();
    userInput.addEventListener('keypress', (e) => {
        if (e.key === 'Enter' && userInput.value.trim() !== '') {
            handleUserMessage(userInput.value.trim());
        }
    });

    sendBtn.onclick = () => {
        if (userInput.value.trim() !== '') {
            handleUserMessage(userInput.value.trim());
        }
    };

    function handleQuickAction(action) {
        handleUserMessage(action);
    }

    function handleUserMessage(text) {
        appendMessage(text, 'sent');
        userInput.value = '';
        quickActions.classList.add('hidden');
        
        if (state.isHumanMode) {
            simulateAgentResponse();
        } else {
            processAI(text);
        }
    }

    async function processAI(text) {
        typingArea.innerText = "ShipAssist AI is thinking...";
        await new Promise(r => setTimeout(r, 1200));
        typingArea.innerText = "";
        
        const response = generateAIResponse(text);
        appendMessage(response.text, 'received');
        
        if (response.escalate) triggerEscalation();
        else quickActions.classList.remove('hidden');
    }

    function generateAIResponse(input) {
        const query = input.toLowerCase();
        
        // Handle Thanks
        if (INTENTS.THANKS.test(query)) return { text: "You're very welcome! Let me know if you need anything else.", escalate: false };
        
        // Tracking ID Regex (Human-like behavior from file 1)
        const trackMatch = input.match(/\b(SPX|SPD)[A-Z0-9]+\b/i); 
        if (trackMatch) {
            const data = db[trackMatch[0].toUpperCase()];
            return { 
                text: data ? `📦 **Found:** ${data.status}\nLocation: ${data.loc}\n${data.note}` : "🔍 I couldn't find that tracking number in our system. Please double-check the code.", 
                escalate: false 
            };
        }

        if (INTENTS.CONTACT.test(query)) return { text: "Connecting you to an agent...", escalate: true };
        if (INTENTS.TRACKING.test(query)) return { text: "Please provide your tracking number (it usually starts with SPX or SPD).", escalate: false };

        return { text: "I can help you track parcels or connect you to a live agent. What would you like to do?", escalate: false };
    }

    function triggerEscalation() {
        state.isHumanMode = true;
        setTimeout(() => {
            appendMessage(`--- System: Agent '${agentName}' Connected ---`, 'system');
            modeBadge.innerText = "HUMAN AGENT";
            modeBadge.className = "mode-badge mode-human";
            connectionStatus.innerText = `Agent online`;
            simulateAgentResponse();
        }, 1500);
    }

    async function simulateAgentResponse() {
        if (state.agentIntroduced) return;
        typingArea.innerText = `${agentName} is typing...`;
        await new Promise(r => setTimeout(r, 1800));
        typingArea.innerText = "";
        appendMessage(`Hi, I'm ${agentName}. I've just joined the chat. How can I help you today?`, 'received agent');
        state.agentIntroduced = true;
    }

    // UI UTILS
    function appendMessage(text, type) {
        const now = new Date();
        const time = now.getHours() + ":" + now.getMinutes().toString().padStart(2, '0');
        const msgDiv = document.createElement('div');
        msgDiv.className = `msg ${type}`;
        msgDiv.innerHTML = `${text.replace(/\n/g, '<br>')}<div class="msg-time">${time} ${type === 'sent' ? '<span class="ticks">✓✓</span>' : ''}</div>`;
        chatContainer.appendChild(msgDiv);
        scrollToBottom();
    }

    function scrollToBottom() {
        chatContainer.scrollTo({ top: chatContainer.scrollHeight, behavior: 'smooth' });
    }

    chatContainer.onscroll = () => {
        const showBtn = chatContainer.scrollTop < (chatContainer.scrollHeight - chatContainer.offsetHeight - 100);
        scrollBtn.style.display = showBtn ? "flex" : "none";
    };
</script>
</body>
</html>
